<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>شاشة الكاشير | سور شوكلت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: top bar with status tabs, order cards grid, newest first */
:root{
  --bg:#F6F0EA; --surface:#FFFFFF; --fg:#2B1A12; --muted:#7D6A5E;
  --line:#EADFD4; --accent:#4A2C1D; --accent-fg:#FFFFFF; --soft:#F3E8DC;
  --new:#4A2C1D; --ok:#1F6F43; --ready:#9A6A00; --done:#5E6670; --cancel:#B23A3A;
  --font:"Tajawal",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;padding-block:18px 40px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* دخول */
.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login h1{margin:0;font-size:1.5rem;font-weight:800}
.login input{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;width:100%}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:12px 18px;font-weight:700}
.err{color:var(--cancel);margin:0}
.muted{color:var(--muted);margin:0;font-size:.9rem}

/* الشريط */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{margin:0;font-size:1.4rem;font-weight:800}
.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--cancel)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tabs .n{font-variant-numeric:tabular-nums;margin-inline-start:4px;opacity:.8}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--muted)}

/* الطلبات */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;
  border-inline-start:5px solid var(--st,var(--line));min-width:0}
.card.fresh{animation:pulse 1.4s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--soft)}}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.no{font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.when{color:var(--muted);font-size:.82rem}
.pill{font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 10px;color:#fff;background:var(--st);white-space:nowrap}
.date{background:var(--soft);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;font-weight:700}
.date span:first-child{color:var(--muted);font-weight:500}
.sufra{font-weight:700}
.items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.items b{color:var(--muted);font-weight:500}
.total{font-weight:800;font-variant-numeric:tabular-nums}
.cust{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.cust .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.phone{font-variant-numeric:tabular-nums;direction:ltr;font-weight:700}
.pref{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.link{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--fg);text-decoration:none;font-size:.88rem;font-weight:600}
.link.wa{border-color:#25D366;color:#13863F}
.addr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:.92rem}
.addr .row{display:flex;gap:6px;align-items:center}
.link.map{border-color:#4285F4;color:#1A56C4}
.notes{background:#FFF8E6;border-radius:8px;padding:6px 10px;font-size:.9rem}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts button{flex:1;min-width:80px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-weight:700;color:var(--fg)}
.acts button.main{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.acts button:disabled{opacity:.5;cursor:wait}
.views{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;width:fit-content;max-width:100%}
.views button{border:0;background:none;border-radius:9px;padding:8px 18px;font-weight:700;color:var(--muted)}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.mcat{margin-bottom:22px}
.mcat-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.mcat-h h2{margin:0;font-size:1.15rem;font-weight:800}
.mitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.mitem{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:start;color:var(--fg);min-width:0}
.mitem span:first-child{min-width:0;overflow-wrap:anywhere}
.mitem .st{flex-shrink:0;font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px;background:#E6F2EA;color:var(--ok)}
.mitem.is-off{background:var(--soft);border-color:var(--cancel)}
.mitem.is-off span:first-child{text-decoration:line-through;color:var(--muted)}
.mitem.is-off .st{background:var(--cancel);color:#fff}
.mitem:disabled{cursor:wait}
.empty{text-align:center;color:var(--muted);padding:60px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));
  background:var(--fg);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.card.fresh{animation:none}}

/* ===== المحرر ===== */
.switch{background:none;border:0;color:var(--accent);font-weight:700;padding:4px;text-decoration:underline;text-underline-offset:3px}
.ed-top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.ed-top h1{margin:0;font-size:1.3rem;font-weight:800}
.ed-acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.dirty{font-size:.85rem;font-weight:700;color:var(--ready)}
.ed-sec{display:flex;flex-direction:column;gap:12px}
.ed-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ed-card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.ed-card-h h2{margin:0;font-size:1.05rem;font-weight:800}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld span{font-size:.8rem;color:var(--muted);font-weight:600}
.fld input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;width:100%;background:var(--surface);color:var(--fg);min-width:0}
.fld input[dir="ltr"]{text-align:left}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini button,.addbtn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-weight:700;color:var(--fg);font-size:.85rem}
.mini button.del{color:var(--cancel);border-color:#E9C4C4}
.mini button:disabled{opacity:.4;cursor:default}
.addbtn{border-style:dashed;color:var(--accent);padding:10px;width:100%}
.ed-items{display:flex;flex-direction:column;gap:10px}
.ed-item{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.thumb{width:84px;height:84px;border-radius:10px;background:var(--soft);display:grid;place-items:center;overflow:hidden;color:var(--accent);font-weight:800;font-size:1.6rem}
.thumb img{width:100%;height:100%;object-fit:cover}
.ed-item .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.imgrow{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.imgrow .fld{flex:1;min-width:160px}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.9rem;color:var(--fg);margin:0}
@media (max-width:520px){.ed-item{grid-template-columns:1fr}.thumb{width:100%;height:140px}}
</style>
</head>
<body>
<div class="wrap">

  <!-- الدخول -->
  <form class="login" id="login">
    <h1>شاشة الكاشير</h1>
    <p class="muted">اكتب كلمة السر عشان تشوف الطلبات</p>
    <label for="key" hidden>كلمة السر</label>
    <input id="key" type="password" autocomplete="current-password" placeholder="كلمة السر" required>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn" type="submit" id="loginBtn">دخول</button>
    <button class="switch" type="button" id="toEditor">دخول المحرر ←</button>
  </form>

  <!-- دخول المحرر -->
  <form class="login" id="edLogin" hidden>
    <h1>دخول المحرر</h1>
    <p class="muted">لتعديل البكجات والأصناف والصور والخصم</p>
    <label for="edEmail" hidden>الإيميل</label>
    <input id="edEmail" type="email" autocomplete="username" placeholder="الإيميل" dir="ltr" required>
    <label for="edPass" hidden>كلمة السر</label>
    <input id="edPass" type="password" autocomplete="current-password" placeholder="كلمة السر" required>
    <p class="err" id="edErr" hidden></p>
    <button class="btn" type="submit" id="edBtn">دخول</button>
    <button class="switch" type="button" id="toCashier">→ رجوع لشاشة الكاشير</button>
  </form>

  <!-- المحرر -->
  <main id="editor" hidden>
    <div class="ed-top">
      <div><h1>محرر سور شوكلت</h1><p class="muted" id="edWho"></p></div>
      <div class="ed-acts">
        <span class="dirty" id="dirty" hidden>● تغييرات ما انحفظت</span>
        <button class="btn" type="button" id="edSave">حفظ ونشر</button>
        <button class="ghost" type="button" id="edOut">خروج</button>
      </div>
    </div>
    <div class="views" id="edViews" role="group" aria-label="قسم المحرر">
      <button type="button" data-v="sufras" aria-pressed="true">البكجات</button>
      <button type="button" data-v="cats" aria-pressed="false">الأصناف</button>
      <button type="button" data-v="disc" aria-pressed="false">الخصم</button>
    </div>
    <section class="ed-sec" id="edSufras"></section>
    <section class="ed-sec" id="edCats" hidden></section>
    <section class="ed-sec" id="edDisc" hidden></section>
  </main>

  <!-- اللوحة -->
  <main id="board" hidden>
    <div class="top">
      <h1>طلبات سور شوكلت</h1>
      <div class="live"><span class="dot" id="dot"></span><span id="liveTxt">متصل</span>
        <button class="ghost" id="notif" type="button" hidden>🖥️ تفعيل إشعارات الجهاز</button>
        <button class="ghost" id="testSound" type="button">🔊 تجربة الصوت</button>
        <button class="ghost" id="sound" type="button">🔔 الصوت شغال</button>
        <button class="ghost" id="logout" type="button">خروج</button>
      </div>
    </div>
    <div class="views" id="views" role="group" aria-label="القسم">
      <button type="button" data-v="orders" aria-pressed="true">الطلبات</button>
      <button type="button" data-v="menu" aria-pressed="false">الأصناف</button>
    </div>
    <section id="ordersView">
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="grid"></div>
    </section>
    <section id="menuView" hidden>
      <p class="muted" style="margin-bottom:14px">اضغط على الصنف عشان توقفه أو ترجّعه. الصنف الموقوف يطلع للعميل "غير متوفر" وما يقدر يختاره. التغيير يوصل للعملاء على طول.</p>
      <div id="menuList"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="menu.js"></script>
<script>
/* =========================================================
   الصق هنا نفس رابط Apps Script اللي في صفحة الطلب
   ========================================================= */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbxnB0QQvYVqVYP_8LuQtdw96P0hPiCWGOz0yyst1O1HVDxXaiGTwwah_bIMdWVZjmr93Q/exec";
const REFRESH_SECONDS = 15;
/* ========================================================= */

const $ = id => document.getElementById(id);
const COLORS = { "جديد":"var(--new)", "مؤكد":"var(--ok)", "جاهز":"var(--ready)", "تم التسليم":"var(--done)", "ملغي":"var(--cancel)" };
const NEXT = { "جديد":"مؤكد", "مؤكد":"جاهز", "جاهز":"تم التسليم" };
const NEXT_LABEL = { "جديد":"قبول الطلب", "مؤكد":"جاهز", "جاهز":"تم التسليم" };
const TABS = [
  { id:"new", label:"جديد", f:o => o.status === "جديد" },
  { id:"work", label:"قيد التنفيذ", f:o => o.status === "مؤكد" || o.status === "جاهز" },
  { id:"done", label:"منتهية", f:o => o.status === "تم التسليم" || o.status === "ملغي" },
  { id:"all", label:"الكل", f:() => true },
];

let OFF = new Set(), view = "orders", savingAvail = false, availVer = 0;
let CATS = typeof MENU_CATEGORIES !== "undefined" ? MENU_CATEGORIES : null;   // تتحدث من إعدادات المحرر
let alarm = null, key = "", orders = [], seen = null, tab = "new", soundOn = true, timer = null, busy = {};
try { key = localStorage.getItem("cashierKey") || ""; soundOn = localStorage.getItem("cashierSound") !== "off"; } catch {}

function toast(m){ const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3000); }

// صوت التنبيه
let ctx = null;
// نغمة إنذار عالية: نغمتين متناوبتين (عالي/واطي) مثل جرس الطلبات، تتكرر ٣ مرات
let master = null;
function beep(){
  if (!soundOn) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (!master) {
      // ضاغط + تكبير عشان الصوت يطلع أعلى بدون تشويش
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -10; comp.knee.value = 0; comp.ratio.value = 12; comp.attack.value = 0.002; comp.release.value = 0.1;
      master = ctx.createGain(); master.gain.value = 1.6;
      master.connect(comp); comp.connect(ctx.destination);
    }
    const t0 = ctx.currentTime + 0.02;
    const notes = [1319, 988, 1319, 988, 1319, 988];   // E6 / B5
    notes.forEach((f, k) => {
      const at = t0 + k * 0.16;
      [1, 2].forEach((mult, layer) => {               // نغمة أساسية + أوكتاف أعلى عشان تخترق الضجة
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = layer ? "triangle" : "square";
        o.frequency.setValueAtTime(f * mult, at);
        o.connect(g); g.connect(master);
        const peak = layer ? 0.25 : 0.55;
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(peak, at + 0.01);
        g.gain.setValueAtTime(peak, at + 0.11);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.15);
        o.start(at); o.stop(at + 0.16);
      });
    });
  } catch {}
}

// التنبيه يتكرر كل ثانيتين لين ما يبقى أي طلب جديد (قبول أو رفض)
// إشعار الجهاز: يطلع حتى لو الكاشير في تبويب أو برنامج ثاني
const canNotify = "Notification" in window;
function updateNotifBtn(){
  const b = $("notif");
  if (!canNotify || Notification.permission === "denied") { b.hidden = !canNotify ? true : false; b.textContent = "🖥️ الإشعارات محظورة من المتصفح"; b.disabled = true; if (!canNotify) b.hidden = true; return; }
  b.hidden = Notification.permission === "granted";
}
async function askNotify(){
  if (!canNotify || Notification.permission !== "default") return;
  try { await Notification.requestPermission(); } catch {}
  updateNotifBtn();
}
function sysNotify(o){
  if (!canNotify || Notification.permission !== "granted") return;
  try {
    const n = new Notification("طلب سور شوكلت جديد #" + o.id, {
      body: `${o.sufra}\n${o.name} · ${prettyDate(o.date)}\n${o.total || ""}`,
      tag: "order-" + o.id, requireInteraction: true
    });
    n.onclick = () => { window.focus(); tab = "new"; render(); n.close(); };
  } catch {}
}

// عنوان التبويب يومض لين يرد الكاشير
let blink = null;
function syncBlink(pending){
  if (pending && !blink) { let on = false; blink = setInterval(() => { on = !on; document.title = on ? "🔴 طلب جديد!" : `(${pending}) شاشة الكاشير`; }, 1000); }
  if (!pending && blink) { clearInterval(blink); blink = null; document.title = "شاشة الكاشير | سور شوكلت"; }
}

function syncAlarm(){
  const pending = orders.some(o => o.status === "جديد");
  syncBlink(orders.filter(o => o.status === "جديد").length);
  if (pending && soundOn) { if (!alarm) { beep(); alarm = setInterval(beep, 2000); } }
  else { clearInterval(alarm); alarm = null; }
}

async function load(){
  if (!SHEET_URL) throw new Error("no_url");
  const v = availVer;
  const res = await fetch(SHEET_URL + "?key=" + encodeURIComponent(key) + "&t=" + Date.now());
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "fail");
  if (data.config && Array.isArray(data.config.categories)) CATS = data.config.categories;
  if (Array.isArray(data.off) && !savingAvail && v === availVer) {
    const next = new Set(data.off);
    const same = next.size === OFF.size && [...next].every(x => OFF.has(x));
    if (!same) { OFF = next; if (view === "menu") renderMenu(); }
  }
  return data.orders || [];
}

async function refresh(){
  try {
    const list = await load();
    const ids = new Set(list.map(o => o.id));
    const fresh = seen ? list.filter(o => !seen.has(o.id) && o.status === "جديد") : [];
    seen = ids; orders = list;
    $("dot").classList.remove("off"); $("liveTxt").textContent = "متصل · آخر تحديث " + new Date().toLocaleTimeString("ar-SA-u-ca-gregory-nu-latn", { hour:"numeric", minute:"2-digit" });
    if (fresh.length) { fresh.forEach(sysNotify); toast(fresh.length === 1 ? "طلب جديد #" + fresh[0].id : fresh.length + " طلبات جديدة"); }
    render(new Set(fresh.map(o => o.id)));
    syncAlarm();
  } catch (e) {
    if (e.message === "key") { logout(); $("loginErr").textContent = "كلمة السر غلط."; $("loginErr").hidden = false; return; }
    $("dot").classList.add("off"); $("liveTxt").textContent = "غير متصل، بنحاول مرة ثانية";
  }
}

function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (isNaN(m)) return "";
  if (m < 1) return "الحين";
  if (m < 60) return `قبل ${m} دقيقة`;
  if (m < 1440) return `قبل ${Math.round(m / 60)} ساعة`;
  return new Date(iso).toLocaleDateString("ar-SA-u-ca-gregory-nu-latn", { day:"numeric", month:"short", hour:"numeric", minute:"2-digit" });
}
function prettyDate(d){
  const x = new Date(d + "T12:00:00");
  return isNaN(x) ? d : x.toLocaleDateString("ar-SA-u-ca-gregory-nu-latn", { weekday:"long", day:"numeric", month:"long" });
}
function waNumber(p){
  let n = String(p).replace(/\D/g, "");
  if (n.startsWith("05")) n = "966" + n.slice(1);
  else if (n.startsWith("5") && n.length === 9) n = "966" + n;
  return n;
}
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

function fixImg(u){
  u = String(u || "").trim(); if (!u) return "";
  const m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w800` : u;

function fld(label, val, onInput, opts = {}){
  const w = el("label", "fld"); const inp = document.createElement("input");
  inp.type = opts.type || "text"; inp.value = val == null ? "" : val;
  if (opts.ltr) inp.dir = "ltr"; if (opts.min != null) inp.min = opts.min; if (opts.step) inp.step = opts.step;
  if (opts.ph) inp.placeholder = opts.ph; if (opts.type === "number") inp.inputMode = "decimal";
  inp.oninput = () => { onInput(opts.type === "number" ? (inp.value === "" ? "" : Number(inp.value)) : inp.value, inp); setDirty(true); };
  w.append(el("span", null, label), inp); return w;
}
function miniBtns(list, i, rerender, delLabel){
  const box = el("div", "mini");
  const up = el("button", null, "↑ فوق"), dn = el("button", null, "↓ تحت"), del = el("button", "del", delLabel || "حذف");
  [up, dn, del].forEach(b => b.type = "button");
  up.disabled = i === 0; dn.disabled = i === list.length - 1;
  up.onclick = () => { [list[i - 1], list[i]] = [list[i], list[i - 1]]; setDirty(true); rerender(); };
  dn.onclick = () => { [list[i + 1], list[i]] = [list[i], list[i + 1]]; setDirty(true); rerender(); };
  del.onclick = () => {
    if (!del.dataset.sure) { del.dataset.sure = "1"; del.textContent = "متأكد؟"; setTimeout(() => { if (del.isConnected) { delete del.dataset.sure; del.textContent = delLabel || "حذف"; } }, 3000); return; }

async function shrink(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 900 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  return cv.toDataURL("image/jpeg", 0.85).split(",")[1];
}
async function uploadFor(it, btn, rerender){

  try {
    const data = await shrink(file);
    const r = await post({ action: "uploadImage", token: edToken, name: it.ar || file.name, mime: "image/jpeg", data });
    if (r.error === "auth") return edExpired();
    if (!r.ok) throw new Error(r.error);
    it.img = r.url; setDirty(true); rerender(); toast("انرفعت الصورة ✓ (لا تنسى حفظ ونشر)");
  } catch { toast("ما قدرنا نرفع الصورة، جرّب مرة ثانية"); lbl.textContent = "📷 رفع صورة"; btn.style.pointerEvents = ""; }
}

function validate(){
  if (!cfg.sufras.length) return "لازم بكج واحد على الأقل.";
  for (const [i, s] of cfg.sufras.entries()) {
    if (!String(s.name.ar || "").trim()) return `البكج رقم ${i + 1} بدون اسم عربي.`;
    if (!(s.picks >= 1)) return `البكج "${s.name.ar}": عدد الأصناف لازم 1 أو أكثر.`;
    if (!(s.min >= 1) || !(s.max >= s.min)) return `البكج "${s.name.ar}": عدد الأشخاص غلط (من لازم أقل من إلى).`;
    if (s.price === "" || !(s.price >= 0)) return `البكج "${s.name.ar}": اكتب السعر.`;
  }
  const cats = cfg.categories.filter(c => (c.items || []).some(it => String(it.ar || "").trim()));
  if (!cats.length) return "لازم فئة فيها صنف واحد على الأقل.";
  for (const c of cfg.categories) {
    if (!String(c.name.ar || "").trim() && (c.items || []).some(it => String(it.ar || "").trim())) return "فيه فئة بدون اسم عربي.";
  }
  return "";
}
$("edSave").onclick = async () => {
  if (edSaving) return;
  const err = validate(); if (err) return toast(err);
  edSaving = true; const b = $("edSave"); b.disabled = true; b.textContent = "جاري الحفظ…";
  try {
    const r = await post({ action: "saveConfig", token: edToken, config: cfg });
    if (r.error === "auth") return edExpired();
    if (!r.ok) throw new Error(r.error);
    cfg = r.config; CATS = cfg.categories; setDirty(false); renderEditor();
    toast("انحفظ ✓ التغييرات طالعة للعملاء الحين");
  } catch (x) { toast(x.message === "too_big" ? "الإعدادات كبيرة مرة، قلّل الأصناف أو الأسماء" : "ما قدرنا نحفظ، تأكد من الإنترنت وجرّب مرة ثانية"); }
  finally { edSaving = false; b.disabled = false; b.textContent = "حفظ ونشر"; }
};

async function openEditor(){
  $("login").hidden = true; $("edLogin").hidden = true; $("board").hidden = true; $("editor").hidden = false;
  $("edWho").textContent = edEmail ? "داخل باسم " + edEmail : "";
  $("edSufras").innerHTML = ""; $("edSufras").append(el("p", "muted", "جاري تحميل الإعدادات…"));
  try {
    const res = await fetch(SHEET_URL + "?action=menu&t=" + Date.now()); const data = await res.json();
    cfg = data.config ? clone(data.config) : defaults();
  } catch { cfg = defaults(); toast("ما قدرنا نجيب الإعدادات من الشيت، معروضة القيم الافتراضية"); }
  setDirty(false); renderEditor();
}
function edLogout(){
  if (edDirty && !confirm("فيه تغييرات ما انحفظت. تبي تطلع؟")) return;
  edToken = ""; edEmail = ""; setDirty(false);
  try { sessionStorage.removeItem("edToken"); sessionStorage.removeItem("edEmail"); } catch {}
  $("editor").hidden = true; $("edLogin").hidden = false;
}
function edExpired(){
  edToken = ""; try { sessionStorage.removeItem("edToken"); } catch {}
  toast("انتهت جلسة المحرر، ادخل مرة ثانية (تغييراتك باقية في الصفحة)");
  $("editor").hidden = true; $("edLogin").hidden = false; $("edErr").hidden = true;
  $("edLogin").dataset.resume = "1";
}
$("edOut").onclick = edLogout;
$("toEditor").onclick = () => { $("login").hidden = true; $("edLogin").hidden = false; $("edEmail").focus(); };
$("toCashier").onclick = () => { $("edLogin").hidden = true; $("login").hidden = false; };
$("edLogin").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("edErr"); err.hidden = true;
  if (!SHEET_URL) { err.textContent = "ما انحط رابط Apps Script في الملف للحين."; err.hidden = false; return; }
  $("edBtn").disabled = true;
  try {
    const r = await post({ action: "editorLogin", email: $("edEmail").value.trim(), password: $("edPass").value });
    if (!r.ok) {
      err.textContent = r.error === "locked" ? "محاولات كثيرة غلط. انتظر ربع ساعة وجرّب." :
        r.error === "editor_off" ? "دخول المحرر مو مفعّل. حط إيميل وكلمة سر المحرر في كود Apps Script." : "الإيميل أو كلمة السر غلط.";
      err.hidden = false; return;
    }
    edToken = r.token; edEmail = r.email; $("edPass").value = "";
    try { sessionStorage.setItem("edToken", edToken); sessionStorage.setItem("edEmail", edEmail); } catch {}
    if ($("edLogin").dataset.resume && cfg) { delete $("edLogin").dataset.resume; $("edLogin").hidden = true; $("editor").hidden = false; $("edWho").textContent = "داخل باسم " + edEmail; return; }
    openEditor();
  } catch { err.textContent = "ما قدرنا نتصل، تأكد من الإنترنت."; err.hidden = false; }
  finally { $("edBtn").disabled = false; }
});
if (edToken && SHEET_URL && !key) openEditor();
</script>
